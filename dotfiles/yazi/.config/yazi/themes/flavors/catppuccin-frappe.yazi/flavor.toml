# vim:fileencoding=utf-8:foldmethod=marker

# Catppuccin Frappe Color Palette:
# Rosewater: #f2d5cf, Flamingo: #eebebe, Pink: #f4b8e4, Mauve: #ca9ee6
# Red: #e78284, Maroon: #ea999c, Peach: #ef9f76, Yellow: #e5c890
# Green: #a6d189, Teal: #81c8be, Sky: #99d1db, Sapphire: #85c1dc
# Blue: #8caaee, Lavender: #babbf1
# Text: #c6d0f5, Subtext: #b5bfe2, Overlay: #949cbb
# Surface: #51576d, Base: #303446, Mantle: #292c3c, Crust: #232634


# : Manager {{{

[mgr]

cwd = { fg = "#8caaee" }

hovered = { reversed = true }
preview_hovered = { underline = true }

find_keyword = { fg = "#e5c890", bold = true, italic = true, underline = true }
find_position = { fg = "#ca9ee6", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "#a6d189", bg = "#a6d189" }
marker_cut = { fg = "#e78284", bg = "#e78284" }
marker_marked = { fg = "#81c8be", bg = "#81c8be" }
marker_selected = { fg = "#e5c890", bg = "#e5c890" }

tab_active = { reversed = true }
tab_inactive = { fg = "#737994" }
tab_width = 1

count_copied = { fg = "#303446", bg = "#a6d189" }
count_cut = { fg = "#303446", bg = "#e78284" }
count_selected = { fg = "#303446", bg = "#e5c890" }

border_symbol = "│"
border_style = { fg = "#737994" }

# : }}}


# : Tabs {{{

[tabs]

active = { fg = "#303446", bg = "#8caaee", bold = true }
inactive = { fg = "#8caaee", bg = "#51576d" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#303446", bg = "#8caaee", bold = true }
normal_alt = { fg = "#8caaee", bg = "#51576d" }

select_main = { fg = "#303446", bg = "#8caaee", bold = true }
select_alt = { fg = "#8caaee", bg = "#51576d" }

unset_main = { fg = "#303446", bg = "#e78284", bold = true }
unset_alt = { fg = "#e78284", bg = "#51576d" }

# : }}}


# : Status bar {{{

[status]

perm_sep = { fg = "#737994" }
perm_type = { fg = "#8caaee" }
perm_read = { fg = "#e5c890" }
perm_write = { fg = "#e78284" }
perm_exec = { fg = "#a6d189" }

progress_label = { fg = "#c6d0f5", bold = true }
progress_normal = { fg = "#8caaee", bg = "#626880" }
progress_error = { fg = "#e78284", bg = "#626880" }

# : }}}


# : Pick {{{

[pick]

border = { fg = "#8caaee" }
active = { fg = "#ca9ee6", bold = true }
inactive = { fg = "#c6d0f5" }

# : }}}


# : Input {{{

[input]

border = { fg = "#8caaee" }
title = { fg = "#c6d0f5" }
value = { fg = "#c6d0f5" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]

border = { fg = "#8caaee" }

# : }}}


# : Tasks {{{

[tasks]

border = { fg = "#8caaee" }
title = { fg = "#c6d0f5" }
hovered = { fg = "#ca9ee6", underline = true }

# : }}}


# : Which {{{

[which]

mask = { bg = "#51576d" }
cand = { fg = "#81c8be" }
rest = { fg = "#737994" }
desc = { fg = "#ca9ee6" }
separator = "  "
separator_style = { fg = "#626880" }

# : }}}


# : Help {{{

[help]

on = { fg = "#81c8be" }
run = { fg = "#ca9ee6" }
hovered = { reversed = true, bold = true }
footer = { fg = "#303446", bg = "#c6d0f5" }

# : }}}


# : Notify {{{

[notify]

title_info = { fg = "#a6d189" }
title_warn = { fg = "#e5c890" }
title_error = { fg = "#e78284" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
  { mime = "image/*", fg = "#81c8be" },
  { mime = "{audio,video}/*", fg = "#e5c890" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ca9ee6" },
  { mime = "application/{pdf,doc,rtf,odt,docx,xlsx,pptx}", fg = "#a6d189" },
  { url = "*", fg = "#c6d0f5" },
  { url = "*/", fg = "#8caaee", bold = true },
]

# : }}}