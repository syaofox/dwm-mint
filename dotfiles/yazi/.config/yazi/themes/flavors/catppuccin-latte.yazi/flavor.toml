# vim:fileencoding=utf-8:foldmethod=marker

# Catppuccin Latte Color Palette (Light Theme):
# Rosewater: #dc8a78, Flamingo: #dd7878, Pink: #ea76cb, Mauve: #8839ef
# Red: #d20f39, Maroon: #e64553, Peach: #fe640b, Yellow: #df8e1d
# Green: #40a02b, Teal: #179299, Sky: #04a5e5, Sapphire: #209fb5
# Blue: #1e66f5, Lavender: #7287fd
# Text: #4c4f69, Subtext: #5c5f77, Overlay: #8c8fa1
# Surface: #bcc0cc, Base: #eff1f5, Mantle: #e6e9ef, Crust: #dce0e8


# : Manager {{{

[mgr]

cwd = { fg = "#1e66f5" }

hovered = { reversed = true }
preview_hovered = { underline = true }

find_keyword = { fg = "#df8e1d", bold = true, italic = true, underline = true }
find_position = { fg = "#8839ef", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "#40a02b", bg = "#40a02b" }
marker_cut = { fg = "#d20f39", bg = "#d20f39" }
marker_marked = { fg = "#179299", bg = "#179299" }
marker_selected = { fg = "#df8e1d", bg = "#df8e1d" }

tab_active = { reversed = true }
tab_inactive = { fg = "#6c6f85" }
tab_width = 1

count_copied = { fg = "#eff1f5", bg = "#40a02b" }
count_cut = { fg = "#eff1f5", bg = "#d20f39" }
count_selected = { fg = "#eff1f5", bg = "#df8e1d" }

border_symbol = "│"
border_style = { fg = "#6c6f85" }

# : }}}


# : Tabs {{{

[tabs]

active = { fg = "#eff1f5", bg = "#1e66f5", bold = true }
inactive = { fg = "#1e66f5", bg = "#bcc0cc" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#eff1f5", bg = "#1e66f5", bold = true }
normal_alt = { fg = "#1e66f5", bg = "#bcc0cc" }

select_main = { fg = "#eff1f5", bg = "#1e66f5", bold = true }
select_alt = { fg = "#1e66f5", bg = "#bcc0cc" }

unset_main = { fg = "#eff1f5", bg = "#d20f39", bold = true }
unset_alt = { fg = "#d20f39", bg = "#bcc0cc" }

# : }}}


# : Status bar {{{

[status]

perm_sep = { fg = "#6c6f85" }
perm_type = { fg = "#1e66f5" }
perm_read = { fg = "#df8e1d" }
perm_write = { fg = "#d20f39" }
perm_exec = { fg = "#40a02b" }

progress_label = { fg = "#4c4f69", bold = true }
progress_normal = { fg = "#1e66f5", bg = "#acb0be" }
progress_error = { fg = "#d20f39", bg = "#acb0be" }

# : }}}


# : Pick {{{

[pick]

border = { fg = "#1e66f5" }
active = { fg = "#8839ef", bold = true }
inactive = { fg = "#4c4f69" }

# : }}}


# : Input {{{

[input]

border = { fg = "#1e66f5" }
title = { fg = "#4c4f69" }
value = { fg = "#4c4f69" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]

border = { fg = "#1e66f5" }

# : }}}


# : Tasks {{{

[tasks]

border = { fg = "#1e66f5" }
title = { fg = "#4c4f69" }
hovered = { fg = "#8839ef", underline = true }

# : }}}


# : Which {{{

[which]

mask = { bg = "#bcc0cc" }
cand = { fg = "#179299" }
rest = { fg = "#6c6f85" }
desc = { fg = "#8839ef" }
separator = "  "
separator_style = { fg = "#acb0be" }

# : }}}


# : Help {{{

[help]

on = { fg = "#179299" }
run = { fg = "#8839ef" }
hovered = { reversed = true, bold = true }
footer = { fg = "#eff1f5", bg = "#4c4f69" }

# : }}}


# : Notify {{{

[notify]

title_info = { fg = "#40a02b" }
title_warn = { fg = "#df8e1d" }
title_error = { fg = "#d20f39" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
  { mime = "image/*", fg = "#179299" },
  { mime = "{audio,video}/*", fg = "#df8e1d" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#8839ef" },
  { mime = "application/{pdf,doc,rtf,odt,docx,xlsx,pptx}", fg = "#40a02b" },
  { url = "*", fg = "#4c4f69" },
  { url = "*/", fg = "#1e66f5", bold = true },
]

# : }}}