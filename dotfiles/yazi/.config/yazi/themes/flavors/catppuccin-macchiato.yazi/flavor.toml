# vim:fileencoding=utf-8:foldmethod=marker

# Catppuccin Macchiato Color Palette:
# Rosewater: #f4dbd6, Flamingo: #f0c6c6, Pink: #f5bde6, Mauve: #c6a0f6
# Red: #ed8796, Maroon: #ee99a0, Peach: #f5a97f, Yellow: #eed49f
# Green: #a6da95, Teal: #8bd5ca, Sky: #91d7e3, Sapphire: #7dc4e4
# Blue: #8aadf4, Lavender: #b7bdf8
# Text: #cad3f5, Subtext: #b8c0e0, Overlay: #939ab7
# Surface: #494d64, Base: #24273a, Mantle: #1e2030, Crust: #181926


# : Manager {{{

[mgr]

cwd = { fg = "#8aadf4" }

hovered = { reversed = true }
preview_hovered = { underline = true }

find_keyword = { fg = "#eed49f", bold = true, italic = true, underline = true }
find_position = { fg = "#c6a0f6", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "#a6da95", bg = "#a6da95" }
marker_cut = { fg = "#ed8796", bg = "#ed8796" }
marker_marked = { fg = "#8bd5ca", bg = "#8bd5ca" }
marker_selected = { fg = "#eed49f", bg = "#eed49f" }

tab_active = { reversed = true }
tab_inactive = { fg = "#6e738d" }
tab_width = 1

count_copied = { fg = "#24273a", bg = "#a6da95" }
count_cut = { fg = "#24273a", bg = "#ed8796" }
count_selected = { fg = "#24273a", bg = "#eed49f" }

border_symbol = "│"
border_style = { fg = "#6e738d" }

# : }}}


# : Tabs {{{

[tabs]

active = { fg = "#24273a", bg = "#8aadf4", bold = true }
inactive = { fg = "#8aadf4", bg = "#494d64" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#24273a", bg = "#8aadf4", bold = true }
normal_alt = { fg = "#8aadf4", bg = "#494d64" }

select_main = { fg = "#24273a", bg = "#8aadf4", bold = true }
select_alt = { fg = "#8aadf4", bg = "#494d64" }

unset_main = { fg = "#24273a", bg = "#ed8796", bold = true }
unset_alt = { fg = "#ed8796", bg = "#494d64" }

# : }}}


# : Status bar {{{

[status]

perm_sep = { fg = "#6e738d" }
perm_type = { fg = "#8aadf4" }
perm_read = { fg = "#eed49f" }
perm_write = { fg = "#ed8796" }
perm_exec = { fg = "#a6da95" }

progress_label = { fg = "#cad3f5", bold = true }
progress_normal = { fg = "#8aadf4", bg = "#5b6078" }
progress_error = { fg = "#ed8796", bg = "#5b6078" }

# : }}}


# : Pick {{{

[pick]

border = { fg = "#8aadf4" }
active = { fg = "#c6a0f6", bold = true }
inactive = { fg = "#cad3f5" }

# : }}}


# : Input {{{

[input]

border = { fg = "#8aadf4" }
title = { fg = "#cad3f5" }
value = { fg = "#cad3f5" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]

border = { fg = "#8aadf4" }

# : }}}


# : Tasks {{{

[tasks]

border = { fg = "#8aadf4" }
title = { fg = "#cad3f5" }
hovered = { fg = "#c6a0f6", underline = true }

# : }}}


# : Which {{{

[which]

mask = { bg = "#494d64" }
cand = { fg = "#8bd5ca" }
rest = { fg = "#6e738d" }
desc = { fg = "#c6a0f6" }
separator = "  "
separator_style = { fg = "#5b6078" }

# : }}}


# : Help {{{

[help]

on = { fg = "#8bd5ca" }
run = { fg = "#c6a0f6" }
hovered = { reversed = true, bold = true }
footer = { fg = "#24273a", bg = "#cad3f5" }

# : }}}


# : Notify {{{

[notify]

title_info = { fg = "#a6da95" }
title_warn = { fg = "#eed49f" }
title_error = { fg = "#ed8796" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
  { mime = "image/*", fg = "#8bd5ca" },
  { mime = "{audio,video}/*", fg = "#eed49f" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c6a0f6" },
  { mime = "application/{pdf,doc,rtf,odt,docx,xlsx,pptx}", fg = "#a6da95" },
  { url = "*", fg = "#cad3f5" },
  { url = "*/", fg = "#8aadf4", bold = true },
]

# : }}}