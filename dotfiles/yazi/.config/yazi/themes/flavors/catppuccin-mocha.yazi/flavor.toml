# vim:fileencoding=utf-8:foldmethod=marker

# Catppuccin Mocha Color Palette:
# Rosewater: #f5e0dc, Flamingo: #f2cdcd, Pink: #f5c2e7, Mauve: #cba6f7
# Red: #f38ba8, Maroon: #eba0ac, Peach: #fab387, Yellow: #f9e2af
# Green: #a6e3a1, Teal: #94e2d5, Sky: #89dceb, Sapphire: #74c7ec
# Blue: #89b4fa, Lavender: #b4befe
# Text: #cdd6f4, Subtext: #bac2de, Overlay: #9399b2
# Surface: #45475a, Base: #1e1e2e, Mantle: #181825, Crust: #11111b


# : Manager {{{

[mgr]

cwd = { fg = "#89b4fa" }

hovered = { reversed = true }
preview_hovered = { underline = true }

find_keyword = { fg = "#f9e2af", bold = true, italic = true, underline = true }
find_position = { fg = "#cba6f7", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked = { fg = "#94e2d5", bg = "#94e2d5" }
marker_selected = { fg = "#f9e2af", bg = "#f9e2af" }

tab_active = { reversed = true }
tab_inactive = { fg = "#6c7086" }
tab_width = 1

count_copied = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#f9e2af" }

border_symbol = "│"
border_style = { fg = "#6c7086" }

# : }}}


# : Tabs {{{

[tabs]

active = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
inactive = { fg = "#89b4fa", bg = "#45475a" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
normal_alt = { fg = "#89b4fa", bg = "#45475a" }

select_main = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
select_alt = { fg = "#89b4fa", bg = "#45475a" }

unset_main = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }
unset_alt = { fg = "#f38ba8", bg = "#45475a" }

# : }}}


# : Status bar {{{

[status]

perm_sep = { fg = "#6c7086" }
perm_type = { fg = "#89b4fa" }
perm_read = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec = { fg = "#a6e3a1" }

progress_label = { fg = "#cdd6f4", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#585b70" }
progress_error = { fg = "#f38ba8", bg = "#585b70" }

# : }}}


# : Pick {{{

[pick]

border = { fg = "#89b4fa" }
active = { fg = "#cba6f7", bold = true }
inactive = { fg = "#cdd6f4" }

# : }}}


# : Input {{{

[input]

border = { fg = "#89b4fa" }
title = { fg = "#cdd6f4" }
value = { fg = "#cdd6f4" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]

border = { fg = "#89b4fa" }

# : }}}


# : Tasks {{{

[tasks]

border = { fg = "#89b4fa" }
title = { fg = "#cdd6f4" }
hovered = { fg = "#cba6f7", underline = true }

# : }}}


# : Which {{{

[which]

mask = { bg = "#45475a" }
cand = { fg = "#94e2d5" }
rest = { fg = "#6c7086" }
desc = { fg = "#cba6f7" }
separator = "  "
separator_style = { fg = "#585b70" }

# : }}}


# : Help {{{

[help]

on = { fg = "#94e2d5" }
run = { fg = "#cba6f7" }
hovered = { reversed = true, bold = true }
footer = { fg = "#1e1e2e", bg = "#cdd6f4" }

# : }}}


# : Notify {{{

[notify]

title_info = { fg = "#a6e3a1" }
title_warn = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
  { mime = "image/*", fg = "#94e2d5" },
  { mime = "{audio,video}/*", fg = "#f9e2af" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#cba6f7" },
  { mime = "application/{pdf,doc,rtf,odt,docx,xlsx,pptx}", fg = "#a6e3a1" },
  { url = "*", fg = "#cdd6f4" },
  { url = "*/", fg = "#89b4fa", bold = true },
]

# : }}}